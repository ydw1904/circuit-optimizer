name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Runners ship rustc; the native core needs nothing else.
      - run: sh circuit_optimizer/native/build.sh
      - run: pip install -e ".[dev]"
      - run: pytest -q
